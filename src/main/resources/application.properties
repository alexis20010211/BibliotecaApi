# ==========================================================
#  APPLICATION
# ==========================================================
spring.application.name=bibliotecaApi
server.port=8080

# ==========================================================
#  DATABASE CONNECTION (PostgreSQL)
# ==========================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/biblioteca
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Dialecto Hibernate para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================================================
#  JPA / HIBERNATE CONFIG
# ==========================================================
# Importante: "none" evita conflicto con schema.sql y data.sql
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================================
#  SECURITY – JWT
# ==========================================================
jwt.secret=mi_super_clave_ultra_secreta_de_256_bits
jwt.expiration=86400000   # 24 horas en ms

# ==========================================================
#  CORS CONFIG
# ==========================================================
cors.allowed-origins=http://localhost:4200,http://localhost:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# ==========================================================
#  SWAGGER / OPENAPI
# ==========================================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packagesToScan=com.biblioteca.bibliotecaApi

# ==========================================================
#  SPRING LOGGING
# ==========================================================
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ==========================================================
#  LOAD SQL SCRIPTS
# ==========================================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Evita errores si schema.sql o data.sql están vacíos
spring.sql.init.continue-on-error=true
