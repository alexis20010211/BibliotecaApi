
#  APPLICATION
spring.application.name=bibliotecaApi
server.port=8080

#  DATABASE CONNECTION (MySQL ejemplo)
spring.datasource.url=jdbc:mysql://localhost:3306/biblioteca_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


#  JPA / HIBERNATE CONFIG
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Para evitar errores de LazyInitialization
spring.jpa.open-in-view=false

=
#  SECURITY – JWT

jwt.secret=mi_super_clave_ultra_secreta_de_256_bits
jwt.expiration=86400000   # 24 horas en ms


#  CORS CONFIG

cors.allowed-origins=http://localhost:4200,http://localhost:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true


#  SWAGGER / OPENAPI

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packagesToScan=com.biblioteca.bibliotecaApi


#  SPRING LOGGING

logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG


#  LOAD SQL SCRIPTS

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
